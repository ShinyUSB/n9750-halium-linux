[core]
# Weston blanks/fades the screen after idle-time seconds of no input.
# The default is 300 (5 minutes), which matches the symptom of the display
# going dark on its own. 0 disables the idle timeout entirely.
idle-time=0

# Cursor size in pixels. Weston 10's default is 32; this makes it easier to
# see on a high-density phone panel.
cursor-size=48

# The DSI panel is physically portrait and exposes only portrait modes
# (1440x3040 preferred, 1080x2280, 720x1520), so landscape is produced by
# rotating the output in the compositor.
#
# NOTE: the value is "rotate-90", NOT "90". Weston 10.0.1 rejects a bare "90"
# (and "180"/"270") with 'Invalid transform "90" for output DSI-1', even though
# `weston --help` still advertises "normal 90 180 270 ...". The help text is
# stale in this build; the accepted names are "normal", "rotate-90",
# "rotate-180", "rotate-270", "flipped", "flipped-rotate-90", ... Verified by
# testing each value against the real DSI-1 output.
#
# This works with the pixman renderer -- no GL needed. Weston also applies the
# inverse transform to input, so touch and mouse follow the rotation.
[output]
name=DSI-1
transform=rotate-90

[output]
name=Virtual-1
mode=off